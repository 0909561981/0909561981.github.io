<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的紀錄 - Endless Shooter</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .history-container {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
    }

    .history-container ol {
      padding-left: 20px;
      margin: 0;
    }

    .history-container li {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .back-button {
      position: absolute; /* 加這行：讓按鈕可以被定位 */
      top: 20px;           /* 離上方 20px */
      left: 20px;          /* 離左側 20px */
      padding: 10px 20px;
      font-size: 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      z-index: 1000; /* 保證在最上層，不被遊戲畫面蓋住 */
    }

    .back-button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <h1>⭐ 我的關卡紀錄</h1>
  <div class="history-container">
    <ol>
    </ol>
  </div>

  <button class="back-button" onclick="location.href='home.html'">← 返回</button>
  <script src="api.js"></script>
  <script>
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    let account = getUrlParam('account') || localStorage.getItem('account') || '';

    const backBtn = document.querySelector('.back-button');
    backBtn.onclick = () => {
      location.href = 'home.html' + (account ? `?account=${encodeURIComponent(account)}` : '');
    };

    function updateSelfTitle() {
      const title = document.createElement('p');
      title.style.textAlign = 'center';
      title.style.marginTop = '10px';
      title.textContent = `👤 Player：${account || '未知'}`;
      document.body.insertBefore(title, document.querySelector('.history-container'));
    }

    async function fetchHistory() {
      if (!account) return console.warn('找不到帳號');

      try {
        const data = await ApiService.postToBackend('/getHistory', { account });

        const container = document.querySelector('.history-container ol');
        container.innerHTML = '';

        if (data.record1 !== null) container.innerHTML += `<li>🌌 上一次遊玩 - Lv${data.record1} 完成</li>`;
        if (data.record2 !== null) container.innerHTML += `<li>🔥 上二次遊玩 - Lv${data.record2} 完成</li>`;
        if (data.record3 !== null) container.innerHTML += `<li>🌲 上三次遊玩 - Lv${data.record3} 完成</li>`;

        if (container.innerHTML.trim() === '') {
          container.innerHTML = '<li>😢 尚未有任何紀錄</li>';
        }

      } catch (err) {
        console.error('取得紀錄失敗：', err);
        const container = document.querySelector('.history-container ol');
        container.innerHTML = '<li>⚠️ 無法取得紀錄</li>';
      }
    }


    updateSelfTitle();
    fetchHistory();
  </script>

</body>
</html>
