<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>螢幕尺寸偵測</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 5vw;
      margin-bottom: 2vh;
    }

    p {
      font-size: 4vw;
      margin: 1vh;
    }
  </style>
</head>
<body>
  <h1>螢幕尺寸資訊</h1>
  <p id="width">寬度：</p>
  <p id="height">高度：</p>

  <script>
    function updateSize() {
      document.getElementById('width').textContent = "寬度：" + window.innerWidth + " px";
      document.getElementById('height').textContent = "高度：" + window.innerHeight + " px";
    }

    window.addEventListener('resize', updateSize);
    window.addEventListener('load', updateSize);
  </script>
</body>
</html>
