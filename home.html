<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Endless Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio id="bgm" src="bgm.mp3" autoplay loop></audio>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    // 修正瀏覽器自動播放限制問題
    window.addEventListener('click', () => {
      const bgm = document.getElementById('bgm');
      bgm.play().catch(() => {});
    }, { once: true });

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const account = urlParams.get('account');
      const playerName = document.getElementById('PlayerName');

      if (account) {
        playerName.textContent = account;
        localStorage.setItem('account', account);
      } else {
        playerName.textContent = '未登入';
      }
    });
  </script>

  <div class="Player_Information">
    <div>😀</div>
    <span id="PlayerName">屎蛋</span> - Lv1
  </div>

  <!-- <button class="Upgrade_Bottom" onclick="location.href='Upgrade.html'">升級</button> -->
  <!-- <button class="Play_Bottom" onclick="location.href='Game.html'">PLAY</button>
  <button class="History_Bottom" onclick="location.href='history.html'">我的紀錄</button>
  <button class="RankingList_Bottom" onclick="location.href='RankingList.html'">排行榜</button> -->
  <button class="Play_Bottom" onclick="goToPage('Game.html')">PLAY</button>
  <button class="History_Bottom" onclick="goToPage('history.html')">我的紀錄</button>
  <button class="RankingList_Bottom" onclick="goToPage('RankingList.html')">排行榜</button>

  <script>
  function getAccount() {
    let account = localStorage.getItem('account');
    if (!account) {
      const urlParams = new URLSearchParams(window.location.search);
      account = urlParams.get('account');
    }
    return account || '';
  }

  async function initHomePage() {
    const account = getAccount();
    if (account) {
      await fetchUserId(account);  // 拿 ID 並儲存
    } else {
      alert('尚未登入，請重新登入');
      window.location.href = 'login.html';
    }
  }

  function goToPage(page) {
    const account = encodeURIComponent(getAccount());
    if (account) {
      window.location.href = `${page}?account=${account}`;
    } else {
      alert('未取得帳號，請重新登入');
      window.location.href = 'login.html';
    }
  }

  initHomePage(); // 呼叫初始化
</script>

 
</body>
</html>
